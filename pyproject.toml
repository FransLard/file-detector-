[project]
name = "file-detector"
version = "1.1.0"
description = "Malware file upload detector - layered heuristics + PE + YARA-like + reputation"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",
  "pefile>=2023.2.7",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
